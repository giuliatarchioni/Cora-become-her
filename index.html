<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CORA // BECOME HER</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CORA" />
  <meta name="theme-color" content="#070709" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23070709'/><rect x='8' y='8' width='164' height='164' rx='34' fill='none' stroke='%23d4af37' stroke-width='2'/><text x='90' y='112' font-family='Georgia, serif' font-size='78' fill='%23d4af37' text-anchor='middle'>C</text></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#070709',
            velvet: '#111116',
            card: '#16161d',
            gold: {
              light: '#f3e5ab',
              DEFAULT: '#d4af37',
              dark: '#9e7f1e'
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #070709;
      color: #f5f5f7;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(24, 24, 32, 0.85), rgba(14, 14, 19, 0.95));
      border: 1px solid rgba(212, 175, 55, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-card-active {
      border-color: rgba(212, 175, 55, 0.65);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.12);
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #b59224 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-btn {
      background: linear-gradient(135deg, #e5c558 0%, #d4af37 50%, #b08d22 100%);
      color: #070709;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .gold-btn:active { transform: scale(0.97); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #070709; }
    ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 99px; }
    @keyframes pulseBreath {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .breath-circle { animation: pulseBreath 8s infinite ease-in-out; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ==================== ONBOARDING PROFONDO (24 STEP A SCELTA MULTIPLA E LIBERA) ==================== -->
  <div id="onboarding-view" class="hidden fixed inset-0 z-50 bg-obsidian overflow-y-auto px-5 py-8 flex flex-col justify-between">
    <div class="max-w-xl mx-auto w-full">
      <div class="flex items-center justify-between mb-6">
        <span class="font-serif italic text-xl gold-gradient-text tracking-wider">CORA // Become Her</span>
        <span id="step-counter" class="text-xs uppercase tracking-widest text-zinc-400">Step 1 / 24</span>
      </div>
      
      <div class="w-full h-1 bg-zinc-800 rounded-full overflow-hidden mb-8">
        <div id="onboarding-progress" class="h-full bg-gradient-to-r from-gold-light to-gold transition-all duration-300" style="width: 4.16%"></div>
      </div>

      <div id="question-container" class="space-y-6"></div>
    </div>

    <div class="max-w-xl mx-auto w-full pt-8 flex items-center justify-between gap-4">
      <button id="prev-btn" onclick="prevStep()" class="px-5 py-3 rounded-xl border border-zinc-800 text-zinc-400 text-sm hover:text-white transition hidden">
        Indietro
      </button>
      <button id="next-btn" onclick="nextStep()" class="ml-auto px-8 py-3.5 rounded-xl gold-btn text-sm tracking-wide shadow-lg">
        Continua
      </button>
    </div>
  </div>

  <!-- ==================== MAIN APP ==================== -->
  <div id="app-view" class="hidden flex-1 flex flex-col max-w-4xl mx-auto w-full pb-24">
    
    <header class="px-5 pt-5 pb-4 flex items-center justify-between border-b border-gold/10 sticky top-0 bg-obsidian/90 backdrop-blur-md z-30">
      <div>
        <p id="header-era" class="text-[11px] uppercase tracking-[0.2em] text-gold">Giorno 1 di 90 • Settimana 1</p>
        <h1 id="header-greeting" class="font-serif text-2xl sm:text-3xl font-semibold text-white">Bentornata</h1>
      </div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <span id="user-level-badge" class="text-[11px] uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-gold/15 text-gold border border-gold/30 font-medium">Lv.1 Awakening</span>
          <div class="w-24 h-1.5 bg-zinc-800 rounded-full mt-1.5 overflow-hidden">
            <div id="xp-bar" class="h-full bg-gold transition-all duration-500" style="width: 15%"></div>
          </div>
        </div>
        <button onclick="openBreathingModal()" title="Respirazione & Reset" class="p-2.5 rounded-full glass-card text-gold hover:bg-gold/10">
          <i data-lucide="wind" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <main id="main-content" class="flex-1 px-5 pt-5 space-y-6"></main>

    <nav class="fixed bottom-0 left-0 right-0 bg-velvet/95 backdrop-blur-xl border-t border-gold/15 z-40 pb-safe">
      <div class="max-w-4xl mx-auto flex justify-around items-center py-2.5 px-2">
        <button onclick="switchTab('today')" data-tab="today" class="nav-btn flex flex-col items-center gap-1 text-gold">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
          <span class="text-[10px] tracking-wide">Oggi</span>
        </button>
        <button onclick="switchTab('study')" data-tab="study" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
          <i data-lucide="book-open" class="w-5 h-5"></i>
          <span class="text-[10px] tracking-wide">Studio</span>
        </button>
        <button onclick="switchTab('beauty')" data-tab="beauty" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
          <i data-lucide="crown" class="w-5 h-5"></i>
          <span class="text-[10px] tracking-wide">Glow & Body</span>
        </button>
        <button onclick="switchTab('calendar')" data-tab="calendar" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
          <i data-lucide="calendar" class="w-5 h-5"></i>
          <span class="text-[10px] tracking-wide">Agenda</span>
        </button>
        <button onclick="switchTab('life')" data-tab="life" class="nav-btn flex flex-col items-center gap-1 text-zinc-500">
          <i data-lucide="compass" class="w-5 h-5"></i>
          <span class="text-[10px] tracking-wide">Guide & Vita</span>
        </button>
      </div>
    </nav>
  </div>

  <div id="breathing-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-lg flex items-center justify-center p-6">
    <div class="glass-card rounded-3xl p-8 max-w-sm w-full text-center space-y-6 relative">
      <button onclick="closeBreathingModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <p class="text-xs uppercase tracking-[0.2em] text-gold">Reset Nervoso & Centratura</p>
      <h3 class="font-serif text-2xl text-white">Respira come Lei</h3>
      <div class="py-6 flex justify-center">
        <div class="w-32 h-32 rounded-full bg-gold/20 border border-gold flex items-center justify-center breath-circle">
          <span id="breath-instruction" class="text-xs uppercase tracking-widest text-gold-light font-medium">Inspira 4s</span>
        </div>
      </div>
      <p class="text-xs text-zinc-400 leading-relaxed">Rallenta il battito, stacca dagli impegni e riconnettiti con la tua energia calma e magnetica.</p>
      <button onclick="addXP(15); closeBreathingModal();" class="w-full py-3 rounded-xl gold-btn text-xs uppercase tracking-wider">Ho completato il reset (+15 XP)</button>
    </div>
  </div>

  <script>
    // ==================== QUESTIONARIO A 24 STEP (PROFILAZIONE PROFONDA A 360 GRADI) ====================
    const QUESTIONS = [
      { id: 'name', category: 'Identità', title: 'Come ti chiami?', subtitle: 'Il tuo nome all’interno del tuo impero personale.', type: 'text', placeholder: 'Es. Sofia, Chiara, Ginevra...' },
      { id: 'ageGroup', category: 'Identità', title: 'Qual è la tua fascia d’età?', subtitle: 'Per calibrare il tono dei consigli e la maturità del percorso.', type: 'select', options: ['14 - 16 anni (Scuola Superiore biennio)', '17 - 19 anni (Scuola Superiore triennio / Maturità)', '20 - 23 anni (Università / Primi anni accademici)', '24+ anni (Università avanzata / Lavoro)'] },
      { id: 'schoolType', category: 'Scuola & Routine', title: 'Qual è il tuo orario scolastico / quotidiano tipico?', subtitle: 'Fondamentale per non piazzarti attività di studio o impegni quando sei in classe.', type: 'select', options: ['Mattina (es. 8:00 - 13:00 o 14:00)', 'Anche rientri pomeridiani (2-3 volte a settimana)', 'Studio da sola / Università con orari flessibili'] },
      { id: 'studyField', category: 'Studio & Carriera', title: 'Quali materie o indirizzo scolastico stai affrontando?', subtitle: 'Per calibrare verifiche, interrogazioni e sessioni pomeridiane.', type: 'text', placeholder: 'Es. Liceo Classico, Scientifico, Scienze Umane, Economia...' },
      { id: 'studyDifficulty', category: 'Studio & Carriera', title: 'Qual è la materia o lo scoglio in cui fai più fatica?', subtitle: 'Il coach ti darà tecniche specifiche per superarlo.', type: 'select', options: ['Matematica / Fisica / Scienze', 'Latino / Greco / Lingue straniere', 'Materie mnemoniche (Storia, Filosofia, Diritto)', 'Gestione del tempo e accumulo di compiti'] },
      { id: 'studyMethod', category: 'Metodo di Studio', title: 'Quale metodo di studio pomeridiano preferisci?', subtitle: 'Per organizzare i tuoi pomeriggi dopo la scuola.', type: 'select', options: ['Pomodoro (25m studio / 5m pausa)', 'Deep Work pomeridiano (50m studio / 10m pausa)', 'Schema immediato appena torno a casa', 'Studio intenso serale (dopo lo sport/relax)'] },
      { id: 'studyHours', category: 'Impegno Pomeridiano', title: 'Quante ore al giorno vuoi dedicare allo studio a casa?', subtitle: 'Senza sovraccaricarti.', type: 'select', options: ['1 - 2 ore (Compiti essenziali)', '3 - 4 ore (Studio approfondito & verifiche)', '5+ ore (Sessione intensa)'] },
      { id: 'mindsetBlock', category: 'Psicologia & Mindset', title: 'Quali sono i tuoi blocchi emotivi o mentali? (Puoi sceglierne più di uno)', subtitle: 'Il coach intercetterà questi pattern nei check-in.', type: 'multiselect', options: ['Ansia da prestazione scolastica e voti', 'Procrastinazione cronica prima di iniziare', 'Mancanza di autostima e confronto con le altre', 'Stanchezza mentale cronica e sbalzi d’umore', 'Difficoltà a mantenere la costanza nei buoni propositi'] },
      { id: 'futureEnergy', category: 'Identità Futura', title: 'Quale archetipo estetico e caratteriale vuoi incarnare?', subtitle: 'La tua bussola per i prossimi 90 giorni.', type: 'select', options: ['Dark Feminine: magnetica, misteriosa, disciplinata', 'Old Money: elegante, colta, raffinata, silenziosa', 'Clean Girl / Pilates Princess: ordinata, fresca, attiva', 'Academic Weapon: brillante, infallibile, inarrestabile'] },
      { id: 'aestheticStyle', category: 'Estetica & Guardaroba', title: 'Quale stile di abbigliamento rispecchia la tua essenza?', subtitle: 'Per curare anche i dettagli di stile e outfit.', type: 'select', options: ['Minimal & Total Black / Neutri', 'Chic / Classico / Blazer & loafers', 'Streetwear lussuoso / Comodo ma curato', 'Romantico / Delicato / Accessori oro'] },
      { id: 'hairType', category: 'Haircare', title: 'Che tipologia di capelli hai?', subtitle: 'Per ricevere trattamenti e maschere specifiche nei giorni giusti.', type: 'select', options: ['Lisci e sottili', 'Mossi / Ondulati crespi', 'Ricci definiti / voluminosi', 'Trattati / tinti / piastrati spesso'] },
      { id: 'skinType', category: 'Skincare', title: 'Qual è la tua tipologia di pelle?', subtitle: 'Per costruire la tua routine mattina prima di scuola e sera.', type: 'select', options: ['Secca o che tira', 'Mista (zona T lucida)', 'Grassa / imperfezioni occasionali', 'Sensibile / delicata'] },
      { id: 'beautyAppointments', category: 'Appuntamenti Estetici', title: 'Quali rituali estetici vuoi pianificare nel calendario? (Puoi sceglierne più di uno)', subtitle: 'L’app li inserisce in automatico e potrai spostarli se li prenoti in un altro giorno.', type: 'multiselect', options: ['Unghie / Manicure (ogni 3 sett.)', 'Parrucchiere / Taglio / Piega (ogni 6 sett.)', 'Sopracciglia / Ciglia (ogni 3 sett.)', 'Maschera capelli profonda (ogni domenica)'] },
      { id: 'bodyGoal', category: 'Corpo & Sport', title: 'Qual è la tua attività fisica o sport preferito?', subtitle: 'Per incastrarlo nei pomeriggi liberi dalla scuola.', type: 'select', options: ['Palestra / Tonificazione', 'Pilates / Yoga / Stretching', 'Camminata veloce all’aperto / Corsa', 'Danza / Nuoto / Sport di squadra', 'Nessuno sport fisso (voglio iniziare a muovermi)'] },
      { id: 'socialHabit', category: 'Digital Detox', title: 'Come vivi il rapporto con i social (TikTok/IG) e le serie TV?', subtitle: 'Per ricevere suggerimenti gentili senza blocchi forzati.', type: 'select', options: ['Controllo il telefono troppo spesso mentre studio', 'Perdo ore la sera su TikTok o Netflix', 'Riesco a gestirli ma voglio più tempo per me', 'Zero problemi, li uso solo nei ritagli di tempo'] },
      { id: 'relationships', category: 'Relazioni & Socialità', title: 'Cosa vuoi migliorare nelle tue amicizie e legami?', subtitle: 'Promemoria gentili per coltivare i legami sani.', type: 'select', options: ['Coltivare le amicizie vere ed eliminare quelle tossiche', 'Saper dire di no senza sentirmi in colpa', 'Migliorare il rapporto in famiglia', 'Concentrarme su me stessa senza distrazioni'] },
      { id: 'financeGoal', category: 'Finanze & Abbondanza', title: 'Gestione della paghetta / piccoli risparmi:', subtitle: 'Per sviluppare mentalità finanziaria e abbondanza.', type: 'select', options: ['Risparmiare per un viaggio o un acquisto importante', 'Evitare spese impulsive online (vestiti, skincare)', 'Imparare a fare un budget mensile', 'Non ho entrate fisse, voglio solo tracciare'] },
      { id: 'sleepTime', category: 'Ritmi Circadiani', title: 'A che ora vai solitamente a dormire la sera?', subtitle: 'Per calcolare il tuo sonno di bellezza.', type: 'select', options: ['Entro le 22:30', 'Tra le 22:30 e le 23:30', 'Mezzanotte o oltre (spesso studio/scrollo tardi)'] },
      { id: 'wakeTime', category: 'Ritmi Circadiani', title: 'A che ora ti svegli la mattina per andare a scuola?', subtitle: 'Per impostare la tua routine mattutina pre-scuola.', type: 'select', options: ['Entro le 06:30 (Sveglia presto / pendolare)', '07:00 - 07:30 (Standard)', 'Dopo le 07:45 (Sveglia vicina all’orario scolastico)'] },
      { id: 'morningVibe', category: 'Routine', title: 'Come vivi le mattine prima di andare a scuola?', subtitle: 'Per creare una sveglia rigenerante e non di fretta.', type: 'select', options: ['Vado sempre di fretta e arrivo all’ultimo', 'Mi piace svegliarmi con calma, musica e caffè/tè', 'Faccio fatica a carburare la mattina'] },
      { id: 'hydrationGoal', category: 'Wellness', title: 'Quante bottigliette d’acqua bevi al giorno?', subtitle: 'Per il tracker idratazione giornaliero.', type: 'select', options: ['Poco o niente (devo ricordarmelo)', 'Circa 1 - 1.5 litri', '2 litri o più (ottima idratazione)'] },
      { id: 'safeSpace', category: 'Mindset', title: 'Qual è il tuo rifugio sicuro quando sei stressata?', subtitle: 'Per i momenti in cui il coach ti consiglia di staccare.', type: 'select', options: ['Musica in cuffia camminando', 'Serie TV / Film di comfort', 'Scrivere sul diario / riflettere', 'Bagno caldo / Skincare rituale'] },
      { id: 'futureDream', category: 'Visione', title: 'Qual è il tuo sogno più grande per i prossimi anni?', subtitle: 'La tua motivazione profonda.', type: 'text', placeholder: 'Es. Entrare nell’università dei miei sogni, viaggiare, diventare indipendente...' },
      { id: 'manifesto', category: 'La Tua Promessa', title: 'Scrivi la tua frase manifesto finale:', subtitle: 'La tua ancora quotidiana.', type: 'text', placeholder: 'Es. La mia disciplina è il mio superpotere.' }
    ];

    let state = JSON.parse(localStorage.getItem('cora_become_her_v3')) || {
      onboarded: false,
      currentStep: 0,
      answers: { beautyAppointments: ['Maschera capelli profonda (ogni domenica)'], mindsetBlock: ['Procrastinazione cronica prima di iniziare'] },
      xp: 30,
      day: 1,
      checkinMorning: { done: false, mood: '', priority1: '' },
      checkinEvening: { done: false, win: '', gratitude: '' },
      routines: [],
      habits: [],
      exams: [],
      appointments: [],
      socialMinutes: 45,
      tvEpisodes: 0,
      savings: { current: 150, goal: 500 }
    };

    function saveState() {
      localStorage.setItem('cora_become_her_v3', JSON.stringify(state));
    }

    function renderOnboarding() {
      document.getElementById('onboarding-view').classList.remove('hidden');
      document.getElementById('app-view').classList.add('hidden');
      
      const q = QUESTIONS[state.currentStep];
      document.getElementById('step-counter').innerText = `Step ${state.currentStep + 1} / ${QUESTIONS.length}`;
      document.getElementById('onboarding-progress').style.width = `${((state.currentStep + 1) / QUESTIONS.length) * 100}%`;
      
      const prevBtn = document.getElementById('prev-btn');
      state.currentStep > 0 ? prevBtn.classList.remove('hidden') : prevBtn.classList.add('hidden');
      document.getElementById('next-btn').innerText = state.currentStep === QUESTIONS.length - 1 ? 'Genera il Mio Impero' : 'Continua';

      const container = document.getElementById('question-container');
      const currentVal = state.answers[q.id] || (q.type === 'multiselect' ? [] : '');

      let inputHTML = '';
      if (q.type === 'text') {
        inputHTML = `<input id="q-input" type="text" value="${currentVal}" placeholder="${q.placeholder}" class="w-full p-4 rounded-2xl bg-velvet border border-gold/30 text-white placeholder-zinc-500 focus:outline-none focus:border-gold text-base" />`;
      } else if (q.type === 'select') {
        inputHTML = `<div class="space-y-2.5">` + q.options.map(opt => {
          const active = currentVal === opt;
          return `<button type="button" onclick="selectOption('${q.id}', '${opt.replace(/'/g, "\\'")}')" class="w-full text-left p-4 rounded-2xl glass-card transition flex items-center justify-between ${active ? 'glass-card-active text-gold-light' : 'text-zinc-300'}">
            <span class="text-sm">${opt}</span>
            <span class="w-4 h-4 rounded-full border ${active ? 'border-gold bg-gold' : 'border-zinc-600'}"></span>
          </button>`;
        }).join('') + `</div>`;
      } else if (q.type === 'multiselect') {
        const arr = Array.isArray(currentVal) ? currentVal : [];
        inputHTML = `<div class="space-y-2.5">` + q.options.map(opt => {
          const active = arr.includes(opt);
          return `<button type="button" onclick="toggleMultiOption('${q.id}', '${opt.replace(/'/g, "\\'")}')" class="w-full text-left p-4 rounded-2xl glass-card transition flex items-center justify-between ${active ? 'glass-card-active text-gold-light' : 'text-zinc-300'}">
            <span class="text-sm">${opt}</span>
            <span class="w-4 h-4 rounded border flex items-center justify-center ${active ? 'border-gold bg-gold text-obsidian' : 'border-zinc-600'}">${active ? '✓' : ''}</span>
          </button>`;
        }).join('') + `</div>`;
      }

      container.innerHTML = `
        <div class="space-y-2">
          <span class="text-xs uppercase tracking-[0.2em] text-gold">${q.category}</span>
          <h2 class="font-serif text-3xl text-white leading-tight">${q.title}</h2>
          <p class="text-sm text-zinc-400">${q.subtitle}</p>
        </div>
        <div class="pt-2">${inputHTML}</div>
      `;
    }

    function selectOption(id, val) {
      state.answers[id] = val;
      renderOnboarding();
    }

    function toggleMultiOption(id, val) {
      if (!Array.isArray(state.answers[id])) state.answers[id] = [];
      const idx = state.answers[id].indexOf(val);
      idx > -1 ? state.answers[id].splice(idx, 1) : state.answers[id].push(val);
      renderOnboarding();
    }

    function prevStep() {
      if (state.currentStep > 0) {
        state.currentStep--;
        renderOnboarding();
      }
    }

    function nextStep() {
      const q = QUESTIONS[state.currentStep];
      if (q.type === 'text') {
        const val = document.getElementById('q-input').value.trim();
        state.answers[q.id] = val || (q.id === 'name' ? 'Regina' : 'Divento inarrestabile');
      }
      if (state.currentStep < QUESTIONS.length - 1) {
        state.currentStep++;
        renderOnboarding();
      } else {
        generatePersonalizedPlan();
      }
    }

    // ==================== GENERAZIONE INTELLIGENTE A 360 GRADI ====================
    function generatePersonalizedPlan() {
      const a = state.answers;
      
      // Routine mattutina calibrata rigorosamente per chi è a scuola al mattino
      state.routines = [
        { id: 1, block: 'Mattina Pre-Scuola', time: '07:00', title: 'Sveglia idratazione (1 bicchiere d’acqua) + Skincare ' + (a.skinType ? a.skinType.split(' ')[0] : 'rapida'), done: false },
        { id: 2, block: 'Mattina Pre-Scuola', time: '07:20', title: 'Colazione & Outfit (' + (a.aestheticStyle ? a.aestheticStyle.split('/')[0] : 'Curato') + ') + Check-in', done: false },
        { id: 3, block: 'Scuola', time: '08:00 - 13:00', title: 'Focus scolastico & attenzione in classe (' + (a.studyField || 'Superiori') + ')', done: false },
        { id: 4, block: 'Pomeriggio', time: '15:00', title: 'Sessione di Studio mirata (' + (a.studyMethod ? a.studyMethod.split('(')[0].trim() : 'Deep Work') + ')', done: false },
        { id: 5, block: 'Pomeriggio', time: '17:30', title: 'Movimento & Sport (' + (a.bodyGoal ? a.bodyGoal.split('/')[0].trim() : 'Pilates/Camminata') + ')', done: false },
        { id: 6, block: 'Sera', time: '21:30', title: 'Digital Detox, Skincare serale & Bilancio giornata', done: false }
      ];

      state.habits = [
        { id: 1, title: '2L di acqua & postura elegante', streak: 1, done: false },
        { id: 2, title: 'Studio pomeridiano completato senza distrazioni', streak: 1, done: false },
        { id: 3, title: 'Zero scrolling sui social durante i compiti', streak: 1, done: false },
        { id: 4, title: 'Un pensiero gentile o gesto per coltivare i legami', streak: 1, done: false }
      ];

      const today = new Date();
      state.appointments = (a.beautyAppointments || []).map((item, idx) => {
        const d = new Date(today);
        d.setDate(today.getDate() + (idx + 1) * 6);
        return {
          id: Date.now() + idx,
          title: item.split('(')[0].trim(),
          frequency: item.includes('(') ? item.split('(')[1].replace(')', '') : 'Ricorrente',
          date: d.toISOString().split('T')[0],
          type: 'Estetica'
        };
      });

      const examDate = new Date(today);
      examDate.setDate(today.getDate() + 14);
      state.exams = [
        { id: 1, subject: 'Verifica / Interrogazione ' + (a.studyField || 'principale'), date: examDate.toISOString().split('T')[0], topics: 'Ripasso argomenti chiave' }
      ];

      state.onboarded = true;
      saveState();
      initApp();
    }

    function initApp() {
      document.getElementById('onboarding-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      updateHeader();
      switchTab('today');
    }

    function updateHeader() {
      const name = state.answers.name || 'Regina';
      const week = Math.ceil(state.day / 7);
      document.getElementById('header-era').innerText = `Giorno ${state.day} di 90 • Settimana ${week}`;
      document.getElementById('header-greeting').innerText = `Ciao, ${name}`;

      const level = Math.floor(state.xp / 100) + 1;
      const titles = ['Awakening', 'Disciplined', 'Magnetic', 'Radiant', 'Iconic Her'];
      const title = titles[Math.min(level - 1, titles.length - 1)];
      document.getElementById('user-level-badge').innerText = `Lv.${level} ${title}`;
      document.getElementById('xp-bar').style.width = `${state.xp % 100}%`;
    }

    function addXP(amount) {
      state.xp += amount;
      saveState();
      updateHeader();
    }

    let currentTab = 'today';
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tab === tab) {
          btn.classList.remove('text-zinc-500');
          btn.classList.add('text-gold');
        } else {
          btn.classList.add('text-zinc-500');
          btn.classList.remove('text-gold');
        }
      });

      const main = document.getElementById('main-content');
      if (tab === 'today') renderToday(main);
      if (tab === 'study') renderStudy(main);
      if (tab === 'beauty') renderBeauty(main);
      if (tab === 'calendar') renderCalendar(main);
      if (tab === 'life') renderLife(main);
      lucide.createIcons();
    }

    function renderToday(container) {
      const a = state.answers;
      container.innerHTML = `
        <div class="glass-card rounded-3xl p-5 border-gold/30">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] uppercase tracking-[0.2em] text-gold">Manifesto • ${a.futureEnergy ? a.futureEnergy.split(':')[0] : 'Become Her'}</span>
            <button onclick="resetOnboarding()" class="text-[11px] text-zinc-400 underline">Rifai Test</button>
          </div>
          <p class="font-serif italic text-xl text-gold-light">“${a.manifesto || 'La mia disciplina è il mio superpotere.'}”</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="glass-card rounded-3xl p-5 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="font-serif text-xl text-white flex items-center gap-2"><i data-lucide="sun" class="w-4 h-4 text-gold"></i> Check-in Mattutino</h3>
              <span class="text-xs text-gold">${state.checkinMorning.done ? 'Completato ✓' : '+25 XP'}</span>
            </div>
            <input type="text" placeholder="Priorità #1 di oggi..." value="${state.checkinMorning.priority1}" onchange="state.checkinMorning.priority1=this.value; saveState();" class="w-full p-2.5 rounded-xl bg-obsidian/80 border border-zinc-800 text-xs text-white" />
            <input type="text" placeholder="Come ti senti stamattina prima di scuola?" value="${state.checkinMorning.mood}" onchange="state.checkinMorning.mood=this.value; saveState();" class="w-full p-2.5 rounded-xl bg-obsidian/80 border border-zinc-800 text-xs text-white" />
            <button onclick="if(!state.checkinMorning.done){state.checkinMorning.done=true; addXP(25); switchTab('today');}" class="w-full py-2.5 rounded-xl ${state.checkinMorning.done ? 'bg-zinc-800 text-zinc-400' : 'gold-btn'} text-xs">
              ${state.checkinMorning.done ? 'Intenzione Fissata' : 'Inizia la Giornata (+25 XP)'}
            </button>
          </div>

          <div class="glass-card rounded-3xl p-5 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="font-serif text-xl text-white flex items-center gap-2"><i data-lucide="moon" class="w-4 h-4 text-gold"></i> Bilancio Serale</h3>
              <span class="text-xs text-gold">${state.checkinEvening.done ? 'Completato ✓' : '+25 XP'}</span>
            </div>
            <input type="text" placeholder="Cosa è andato bene oggi a scuola/studio?" value="${state.checkinEvening.win}" onchange="state.checkinEvening.win=this.value; saveState();" class="w-full p-2.5 rounded-xl bg-obsidian/80 border border-zinc-800 text-xs text-white" />
            <input type="text" placeholder="Una gratitudine per stasera..." value="${state.checkinEvening.gratitude}" onchange="state.checkinEvening.gratitude=this.value; saveState();" class="w-full p-2.5 rounded-xl bg-obsidian/80 border border-zinc-800 text-xs text-white" />
            <button onclick="if(!state.checkinEvening.done){state.checkinEvening.done=true; addXP(25); switchTab('today');}" class="w-full py-2.5 rounded-xl ${state.checkinEvening.done ? 'bg-zinc-800 text-zinc-400' : 'gold-btn'} text-xs">
              ${state.checkinEvening.done ? 'Giornata Chiusa' : 'Chiudi Giornata (+25 XP)'}
            </button>
          </div>
        </div>

        <div class="glass-card rounded-3xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-serif text-2xl text-white">Il Tuo Flusso Intelligente</h3>
              <p class="text-xs text-zinc-400">Calibrated su orario scolastico e studio pomeridiano</p>
            </div>
            <button onclick="addNewRoutine()" class="px-3 py-1.5 rounded-xl border border-gold/40 text-gold text-xs">+ Aggiungi</button>
          </div>
          <div class="space-y-2.5">
            ${state.routines.map(r => `
              <div onclick="toggleRoutine(${r.id})" class="p-3.5 rounded-2xl bg-obsidian/70 border ${r.done ? 'border-gold/40 opacity-60' : 'border-zinc-800'} flex items-center justify-between cursor-pointer">
                <div class="flex items-center gap-3">
                  <div class="w-5 h-5 rounded-full border ${r.done ? 'bg-gold border-gold text-obsidian' : 'border-gold/50'} flex items-center justify-center text-xs">${r.done ? '✓' : ''}</div>
                  <div>
                    <p class="text-sm ${r.done ? 'line-through text-zinc-400' : 'text-white'}">${r.title}</p>
                    <span class="text-[11px] text-gold">${r.block} • ${r.time}</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="glass-card rounded-3xl p-5 space-y-4">
          <h3 class="font-serif text-2xl text-white">Abitudini Non-Negoziabili</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${state.habits.map(h => `
              <div onclick="toggleHabit(${h.id})" class="p-3.5 rounded-2xl bg-obsidian/70 border ${h.done ? 'border-gold/50' : 'border-zinc-800'} flex items-center justify-between cursor-pointer">
                <span class="text-xs ${h.done ? 'text-gold-light line-through' : 'text-zinc-200'}">${h.title}</span>
                <span class="text-[11px] px-2 py-0.5 rounded-full bg-gold/10 text-gold">🔥 ${h.streak}g</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleRoutine(id) {
      const r = state.routines.find(x => x.id === id);
      if (r) {
        r.done = !r.done;
        if (r.done) addXP(15);
        saveState();
        switchTab('today');
      }
    }

    function toggleHabit(id) {
      const h = state.habits.find(x => x.id === id);
      if (h) {
        h.done = !h.done;
        if (h.done) { h.streak++; addXP(10); }
        saveState();
        switchTab('today');
      }
    }

    function addNewRoutine() {
      const title = prompt('Nuovo step nella tua routine:');
      if (!title) return;
      const time = prompt('Orario (es. 15:30 o Pomeriggio):', 'Pomeriggio') || 'Pomeriggio';
      state.routines.push({ id: Date.now(), block: 'Personalizzato', time, title, done: false });
      saveState();
      switchTab('today');
    }

    function renderStudy(container) {
      const a = state.answers;
      container.innerHTML = `
        <div class="glass-card rounded-3xl p-5 space-y-3">
          <span class="text-[11px] uppercase tracking-[0.2em] text-gold">Coach Scolastico • ${a.studyField || 'Scuola'}</span>
          <h2 class="font-serif text-2xl text-white">Strategia Pomeridiana per la tua Mente</h2>
          <p class="text-xs text-zinc-300 leading-relaxed">
            Visto che la mattina sei impegnata a scuola, il tuo impero accademico si costruisce al pomeriggio. Il coach ha rilevato il tuo scoglio (<strong class="text-gold-light">${a.studyDifficulty || 'Gestione tempo'}</strong>) e suggerisce blocchi pomeridiani di tipo <strong class="text-gold-light">${a.studyMethod || 'Deep Work'}</strong> senza telefono vicino.
          </p>
        </div>

        <div class="glass-card rounded-3xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-serif text-2xl text-white">Verifiche & Interrogazioni</h3>
            <button onclick="addExam()" class="px-3.5 py-2 rounded-xl gold-btn text-xs">+ Nuova Verifica</button>
          </div>
          
          <div class="space-y-4">
            ${state.exams.map(ex => {
              const daysLeft = Math.max(0, Math.ceil((new Date(ex.date) - new Date()) / (1000 * 60 * 60 * 24)));
              const studyDays = Math.max(1, Math.floor(daysLeft * 0.75));
              const reviewDays = Math.max(1, daysLeft - studyDays);
              return `
                <div class="p-4 rounded-2xl bg-obsidian/80 border border-gold/25 space-y-3">
                  <div class="flex items-center justify-between">
                    <div>
                      <h4 class="font-serif text-xl text-white">${ex.subject}</h4>
                      <p class="text-xs text-zinc-400">Data: ${ex.date} • ${ex.topics}</p>
                    </div>
                    <div class="text-center px-3 py-1.5 rounded-xl bg-gold/15 border border-gold/30">
                      <span class="block font-serif text-xl text-gold font-bold">-${daysLeft}</span>
                      <span class="text-[10px] uppercase text-gold-light">Giorni</span>
                    </div>
                  </div>
                  <div class="p-3 rounded-xl bg-velvet border border-zinc-800 text-xs text-zinc-300 space-y-1">
                    <p class="text-gold font-medium">Piano Pomeridiano Automatico:</p>
                    <p>• <strong>Prossimi ${studyDays} pomeriggi:</strong> Studio attivo dei capitoli</p>
                    <p>• <strong>Ultimi ${reviewDays} pomeriggi:</strong> Ripasso generale e simulazione interrogazione</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function addExam() {
      const subject = prompt('Materia o verifica (es. Verifica di Latino, Interrogazione di Storia):');
      if (!subject) return;
      const date = prompt('Data (AAAA-MM-GG):', '2026-12-15');
      if (!date) return;
      const topics = prompt('Argomenti da preparare:', 'Programma');
      state.exams.push({ id: Date.now(), subject, date, topics });
      saveState();
      switchTab('study');
    }

    function renderBeauty(container) {
      const a = state.answers;
      let hairAdvice = 'Shampoo delicato, maschera nutriente e olio protettivo sulle punte.';
      if ((a.hairType || '').includes('Ricci')) hairAdvice = 'Trattamento idratante profondo, leave-in e asciugatura con diffusore per definire i ricci.';
      
      let skinAdvice = 'Detergente delicato, idratante leggero e SPF 50 prima di uscire per la scuola.';
      if ((a.skinType || '').includes('Grassa')) skinAdvice = 'Detergente in gel purificante, niacinamide e idratante oil-free.';

      container.innerHTML = `
        <div class="glass-card rounded-3xl p-5 space-y-4">
          <span class="text-[11px] uppercase tracking-[0.2em] text-gold">Protocollo Glow & Estetica</span>
          <h2 class="font-serif text-2xl text-white">Trattamenti Su Misura per Te</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-4 rounded-2xl bg-obsidian/80 border border-gold/20 space-y-2">
              <p class="text-xs uppercase tracking-wider text-gold">Haircare • ${a.hairType || 'Capelli'}</p>
              <p class="text-xs text-zinc-300 leading-relaxed">${hairAdvice}</p>
            </div>
            <div class="p-4 rounded-2xl bg-obsidian/80 border border-gold/20 space-y-2">
              <p class="text-xs uppercase tracking-wider text-gold">Skincare Pre-Scuola • ${a.skinType || 'Pelle'}</p>
              <p class="text-xs text-zinc-300 leading-relaxed">${skinAdvice}</p>
            </div>
          </div>
        </div>

        <div class="glass-card rounded-3xl p-5 space-y-3">
          <h3 class="font-serif text-xl text-white">Movimento & Sport • ${a.bodyGoal || 'Attività'}</h3>
          <p class="text-xs text-zinc-400">Inserito nel tuo pomeriggio dopo i compiti: sessione di ${a.bodyGoal || 'movimento e stretching'} per scaricare lo stress scolastico.</p>
          <button onclick="addXP(20); alert('Allenamento registrato! +20 XP');" class="px-4 py-2.5 rounded-xl gold-btn text-xs">Registra Sport Pomeridiano (+20 XP)</button>
        </div>
      `;
    }

    function renderCalendar(container) {
      const allEvents = [
        ...state.appointments.map(ap => ({ ...ap, kind: 'appointment' })),
        ...state.exams.map(ex => ({ id: ex.id, title: ex.subject, date: ex.date, frequency: ex.topics, kind: 'exam' }))
      ].sort((a, b) => new Date(a.date) - new Date(b.date));

      container.innerHTML = `
        <div class="glass-card rounded-3xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="font-serif text-2xl text-white">Calendario Imperiale</h2>
              <p class="text-xs text-zinc-400">Modifica le date in base a quando hai prenotato</p>
            </div>
            <button onclick="addCustomAppointment()" class="px-3.5 py-2 rounded-xl gold-btn text-xs">+ Evento</button>
          </div>

          <div class="space-y-3">
            ${allEvents.map(ev => {
              const daysLeft = Math.ceil((new Date(ev.date) - new Date()) / (1000 * 60 * 60 * 24));
              return `
                <div class="p-4 rounded-2xl bg-obsidian/80 border ${ev.kind === 'exam' ? 'border-gold/50' : 'border-zinc-800'} flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <span class="text-[10px] uppercase tracking-widest px-2 py-0.5 rounded bg-gold/15 text-gold">${ev.kind === 'exam' ? 'Scuola / Verifica' : 'Cura Estetica'}</span>
                    <h4 class="font-serif text-lg text-white mt-1">${ev.title}</h4>
                    <p class="text-xs text-zinc-400">${ev.frequency} • ${daysLeft >= 0 ? `Tra ${daysLeft} giorni` : 'Passato'}</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <label class="text-[11px] text-zinc-400">Data:</label>
                    <input type="date" value="${ev.date}" onchange="rescheduleEvent('${ev.kind}', ${ev.id}, this.value)" class="p-2 rounded-xl bg-velvet border border-gold/30 text-xs text-gold-light" />
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function rescheduleEvent(kind, id, newDate) {
      if (kind === 'appointment') {
        const item = state.appointments.find(x => x.id === id);
        if (item) item.date = newDate;
      } else {
        const item = state.exams.find(x => x.id === id);
        if (item) item.date = newDate;
      }
      saveState();
      switchTab('calendar');
    }

    function addCustomAppointment() {
      const title = prompt('Titolo appuntamento (es. Parrucchiere, Unghie):');
      if (!title) return;
      const date = prompt('Data (AAAA-MM-GG):', new Date().toISOString().split('T')[0]);
      if (!date) return;
      state.appointments.push({ id: Date.now(), title, date, frequency: 'Singolo', type: 'Estetica' });
      saveState();
      switchTab('calendar');
    }

    function renderLife(container) {
      const week = Math.ceil(state.day / 7);
      const a = state.answers;
      
      const guides = [
        { week: 1, title: `Superare l'ansia scolastica e i blocchi mentali`, desc: 'Strategie mentali per affrontare le interrogazioni senza panico.' },
        { week: 2, title: `Metodo Deep Work pomeridiano`, desc: 'Come finire i compiti in metà tempo ed avere la serata libera.' },
        { week: 3, title: `Incarnare l'energia ${a.futureEnergy ? a.futureEnergy.split(':')[0] : 'Become Her'}`, desc: 'Portata di classe, sicurezza e magnetismo nei corridoi della scuola.' }
      ];

      container.innerHTML = `
        <div class="glass-card rounded-3xl p-5 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-[11px] uppercase tracking-[0.2em] text-gold">Libreria Esclusiva</span>
              <h2 class="font-serif text-2xl text-white">Le Tue Guide Settimanali</h2>
            </div>
            <button onclick="state.day += 7; saveState(); updateHeader(); switchTab('life');" class="text-[11px] px-2.5 py-1 rounded-lg border border-gold/30 text-gold">Simula +1 Settimana</button>
          </div>
          <div class="space-y-3">
            ${guides.map(g => {
              const unlocked = week >= g.week;
              return `
                <div class="p-4 rounded-2xl bg-obsidian/80 border ${unlocked ? 'border-gold/30' : 'border-zinc-800 opacity-50'} flex items-center justify-between gap-4">
                  <div>
                    <span class="text-[10px] uppercase tracking-wider text-gold">Settimana ${g.week} ${unlocked ? '• Sbloccata' : '• Bloccata'}</span>
                    <h4 class="font-serif text-lg text-white">${g.title}</h4>
                    <p class="text-xs text-zinc-400 mt-1">${unlocked ? g.desc : 'Avanza nei giorni per sbloccare.'}</p>
                  </div>
                  ${unlocked ? `<button onclick="addXP(20); alert('Guida letta! +20 XP');" class="px-3 py-2 rounded-xl gold-btn text-xs shrink-0">Leggi</button>` : `<i data-lucide="lock" class="w-5 h-5 text-zinc-500 shrink-0"></i>`}
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="glass-card rounded-3xl p-5 space-y-3">
            <h3 class="font-serif text-xl text-white">Equilibrio Social & Serie TV</h3>
            <p class="text-xs text-zinc-400">Consiglio del coach: max <strong class="text-gold-light">60 min</strong> di social dopo aver finito i compiti.</p>
            <div class="flex items-center justify-between text-xs pt-1">
              <span>Social oggi: <strong>${state.socialMinutes} min</strong></span>
              <div class="flex gap-2">
                <button onclick="state.socialMinutes += 15; saveState(); switchTab('life');" class="px-2.5 py-1 rounded-lg bg-zinc-800 text-white">+15m</button>
                <button onclick="openBreathingModal()" class="px-2.5 py-1 rounded-lg border border-gold/40 text-gold">Reset</button>
              </div>
            </div>
            <div class="flex items-center justify-between text-xs pt-1">
              <span>Serie TV serali: <strong>${state.tvEpisodes}</strong></span>
              <button onclick="state.tvEpisodes++; saveState(); switchTab('life');" class="px-2.5 py-1 rounded-lg bg-zinc-800 text-white">+1 Ep.</button>
            </div>
          </div>

          <div class="glass-card rounded-3xl p-5 space-y-3">
            <h3 class="font-serif text-xl text-white">Relazioni & Risparmio</h3>
            <div class="p-3 rounded-xl bg-obsidian/70 border border-gold/20 text-xs text-zinc-300">
              <span class="text-gold block font-medium mb-0.5">Relazioni (${a.relationships || 'Cura'}):</span>
              Coltiva chi ti sostiene e metti confini sani con chi ti drena energie.
            </div>
            <div class="pt-1 space-y-1.5">
              <div class="flex justify-between text-xs">
                <span>Risparmio: <strong class="text-gold">€${state.savings.current}</strong> / €${state.savings.goal}</span>
                <button onclick="const add=Number(prompt('Quanto vuoi aggiungere (€)?', '20')); if(add){state.savings.current+=add; addXP(15); saveState(); switchTab('life');}" class="text-gold underline">+ Versa</button>
              </div>
              <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full bg-gold" style="width: ${Math.min(100, (state.savings.current / state.savings.goal) * 100)}%"></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function openBreathingModal() {
      document.getElementById('breathing-modal').classList.remove('hidden');
      let phase = 0;
      const texts = ['Inspira 4s', 'Trattieni 4s', 'Espira 6s'];
      window.breathTimer = setInterval(() => {
        phase = (phase + 1) % texts.length;
        const el = document.getElementById('breath-instruction');
        if (el) el.innerText = texts[phase];
      }, 3500);
    }

    function closeBreathingModal() {
      document.getElementById('breathing-modal').classList.add('hidden');
      clearInterval(window.breathTimer);
    }

    function resetOnboarding() {
      if (confirm('Vuoi rifare il questionario ultra-completo da 24 step per ricalibrare l’app?')) {
        state.onboarded = false;
        state.currentStep = 0;
        saveState();
        renderOnboarding();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      state.onboarded ? initApp() : renderOnboarding();
    });
  </script>
</body>
</html>
