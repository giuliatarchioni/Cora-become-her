<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Become Her</title>
    <!-- Tailwind CSS per un design pulito e responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cora: {
                            bg: '#F9F6F0',       /* Avorio delicato */
                            card: '#FFFFFF',     /* Bianco puro */
                            cream: '#F3ECE1',    /* Crema scuro */
                            beige: '#E5DAC8',    /* Beige caldo */
                            taupe: '#A49688',    /* Tortora */
                            brown: '#4A3E3D',    /* Marrone caldo */
                            accent: '#D4B5B0',   /* Rosa cipria delicato */
                            lightpink: '#FAF4F2' /* Sfondo rosa cipria chiarissimo */
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F9F6F0;
            color: #4A3E3D;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        /* Nascondi scrollbar ma mantieni funzionalità */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Smooth transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-cora-bg text-cora-brown min-h-screen flex flex-col justify-between selection:bg-cora-accent selection:text-white">

    <!-- CONTAINER PRINCIPALE -->
    <div id="app-container" class="w-full max-w-md mx-auto flex-1 flex flex-col pb-24 relative overflow-x-hidden">
        <!-- Il contenuto verrà iniettato dinamicamente via JS -->
    </div>

    <!-- BARRA DI NAVIGAZIONE FISSA IN BASSO (Visibile solo dopo l'onboarding) -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-cora-beige px-4 py-2 z-50 flex justify-around items-center shadow-lg">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center p-2 text-cora-taupe transition-colors">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1 font-medium">Home</span>
        </button>
        <button onclick="switchTab('routines')" id="nav-routines" class="flex flex-col items-center p-2 text-cora-taupe transition-colors">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1 font-medium">Routine</span>
        </button>
        <button onclick="switchTab('habits')" id="nav-habits" class="flex flex-col items-center p-2 text-cora-taupe transition-colors">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1 font-medium">Abitudini</span>
        </button>
        <button onclick="switchTab('calendar')" id="nav-calendar" class="flex flex-col items-center p-2 text-cora-taupe transition-colors">
            <i data-lucide="calendar" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1 font-medium">Calendario</span>
        </button>
        <button onclick="switchTab('menu')" id="nav-menu" class="flex flex-col items-center p-2 text-cora-taupe transition-colors">
            <i data-lucide="menu" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1 font-medium">Altro</span>
        </button>
    </nav>

    <!-- LOGICA DELL'APPLICAZIONE -->
    <script>
        // Stato Globale dell'App
        let state = {
            onboardingCompleted: false,
            currentTab: 'dashboard',
            userProfile: {
                wakeTime: '07:00',
                sleepTime: '23:00',
                busyDays: ['Lunedì', 'Mercoledì'],
                morningTime: '30 minuti',
                eveningTime: '45 minuti',
                focusArea: 'Produttività e studio',
                beautyGoals: 'Skincare quotidiana e cura capelli'
            },
            routines: {
                morning: [
                    { id: 1, title: 'Bicchiere d\'acqua e limone', time: '10 min', completed: false },
                    { id: 2, title: 'Skincare mattutina', time: '15 min', completed: false },
                    { id: 3, title: 'Colazione consapevole', time: '20 min', completed: false }
                ],
                evening: [
                    { id: 1, title: 'Skincare serale e detersione', time: '15 min', completed: false },
                    { id: 2, title: 'Digital detox (no schermo)', time: '30 min', completed: false },
                    { id: 3, title: 'Pianificazione giornata domani', time: '10 min', completed: false }
                ]
            },
            habits: [
                { id: 1, title: 'Bere 1.5L di acqua', streak: 4, completedToday: false },
                { id: 2, title: 'Lettura (20 pagine)', streak: 2, completedToday: false },
                { id: 3, title: 'Studio concentrato', streak: 5, completedToday: true },
                { id: 4, title: 'Skincare routine', streak: 7, completedToday: false }
            ],
            beautyProducts: [
                { id: 1, name: 'Siero Viso Idratante', brand: 'The Ordinary', category: 'Skincare', status: 'In uso', rating: 5 },
                { id: 2, name: 'Maschera Capelli Nutriente', brand: 'Gisou', category: 'Haircare', status: 'In uso', rating: 4 },
                { id: 3, name: 'Protezione Solare SPF 50', brand: 'La Roche-Posay', category: 'Skincare', status: 'Da acquistare', rating: 5 }
            ],
            journalEntries: [],
            studySubjects: [
                { id: 1, name: 'Letteratura Italiana', progress: 65, nextTask: 'Analisi Leopardi' },
                { id: 2, name: 'Matematica', progress: 40, nextTask: 'Studio derivate' },
                { id: 3, name: 'Inglese', progress: 80, nextTask: 'Saggio argomentativo' }
            ],
            goals: [
                { id: 1, title: 'Migliorare media scolastica', progress: 70, category: 'Studio' },
                { id: 2, title: 'Costanza nella skincare & haircare', progress: 85, category: 'Beauty' }
            ],
            challenges: [
                { id: 1, title: 'Glow Up Challenge 7 Giorni', progress: 4, total: 7, active: true }
            ],
            pomodoroTime: 25 * 60,
            pomodoroActive: false,
            pomodoroTimerRef: null
        };

        // Salvataggio e caricamento dati da localStorage
        function saveData() {
            localStorage.setItem('become_her_state', JSON.stringify(state));
        }

        function loadData() {
            const saved = localStorage.getItem('become_her_state');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch(e) {
                    console.error('Errore nel caricamento dati', e);
                }
            }
        }

        // Inizializzazione
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            render();
        });

        // Gestione Tab e Routing
        function switchTab(tab) {
            state.currentTab = tab;
            render();
            window.scrollTo(0, 0);
        }

        function render() {
            const container = document.getElementById('app-container');
            const nav = document.getElementById('bottom-nav');

            if (!state.onboardingCompleted) {
                nav.classList.add('hidden');
                container.innerHTML = renderOnboarding();
            } else {
                nav.classList.remove('hidden');
                updateNavIcons();
                
                switch(state.currentTab) {
                    case 'dashboard':
                        container.innerHTML = renderDashboard();
                        break;
                    case 'routines':
                        container.innerHTML = renderRoutines();
                        break;
                    case 'habits':
                        container.innerHTML = renderHabits();
                        break;
                    case 'calendar':
                        container.innerHTML = renderCalendar();
                        break;
                    case 'menu':
                        container.innerHTML = renderMenu();
                        break;
                    case 'beauty':
                        container.innerHTML = renderBeauty();
                        break;
                    case 'study':
                        container.innerHTML = renderStudy();
                        break;
                    case 'journal':
                        container.innerHTML = renderJournal();
                        break;
                    case 'goals':
                        container.innerHTML = renderGoals();
                        break;
                    default:
                        container.innerHTML = renderDashboard();
                }
            }
            lucide.createIcons();
        }

        function updateNavIcons() {
            ['dashboard', 'routines', 'habits', 'calendar', 'menu'].forEach(tab => {
                const btn = document.getElementById(`nav-${tab}`);
                if (btn) {
                    if (state.currentTab === tab) {
                        btn.className = "flex flex-col items-center p-2 text-cora-brown font-semibold transition-colors scale-105";
                    } else {
                        btn.className = "flex flex-col items-center p-2 text-cora-taupe hover:text-cora-brown transition-colors";
                    }
                }
            });
        }

        // ==================== ONBOARDING ====================
        function renderOnboarding() {
            return `
                <div class="min-h-screen flex flex-col justify-between p-6 fade-in">
                    <div class="space-y-6 mt-6">
                        <div class="text-center space-y-2">
                            <span class="text-xs uppercase tracking-widest text-cora-taupe font-semibold">Benvenuta nel tuo spazio</span>
                            <h1 class="text-4xl font-serif text-cora-brown">Become Her</h1>
                            <p class="text-sm text-cora-taupe max-w-xs mx-auto">Il tuo assistente personale per routine, benessere, beauty e crescita personale.</p>
                        </div>
                        
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-cora-beige space-y-4">
                            <h2 class="font-serif text-lg text-cora-brown border-b border-cora-cream pb-2">Configuriamo la tua esperienza</h2>
                            
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-cora-taupe uppercase mb-1">A che ora ti svegli abitualmente?</label>
                                    <input type="time" id="onb-wake" value="${state.userProfile.wakeTime}" class="w-full p-3 bg-cora-lightpink rounded-xl border border-cora-beige text-cora-brown focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-cora-taupe uppercase mb-1">A che ora vai a dormire?</label>
                                    <input type="time" id="onb-sleep" value="${state.userProfile.sleepTime}" class="w-full p-3 bg-cora-lightpink rounded-xl border border-cora-beige text-cora-brown focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-cora-taupe uppercase mb-1">Qual è la tua priorità principale?</label>
                                    <select id="onb-focus" class="w-full p-3 bg-cora-lightpink rounded-xl border border-cora-beige text-cora-brown focus:outline-none">
                                        <option value="Produttività e studio">Produttività e studio</option>
                                        <option value="Benessere e self-care">Benessere e self-care</option>
                                        <option value="Equilibrio quotidiano">Equilibrio quotidiano</option>
                                        <option value="Beauty e skincare">Beauty e skincare</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8">
                        <button onclick="completeOnboarding()" class="w-full py-4 bg-cora-brown text-white rounded-2xl font-medium shadow-md hover:bg-opacity-90 transition-all flex items-center justify-center gap-2">
                            <span>Inizia il tuo percorso</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function completeOnboarding() {
            const wake = document.getElementById('onb-wake').value;
            const sleep = document.getElementById('onb-sleep').value;
            const focus = document.getElementById('onb-focus').value;

            state.userProfile.wakeTime = wake || '07:00';
            state.userProfile.sleepTime = sleep || '23:00';
            state.userProfile.focusArea = focus;
            state.onboardingCompleted = true;
            saveData();
            render();
        }

        // ==================== DASHBOARD ====================
        function renderDashboard() {
            const today = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
            
            return `
                <div class="p-6 space-y-6 fade-in">
                    <!-- Intestazione -->
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">${today}</span>
                            <h1 class="text-2xl font-serif text-cora-brown mt-0.5">Buongiorno ✨</h1>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-cora-beige flex items-center justify-center text-cora-brown font-serif font-bold shadow-inner">
                            BH
                        </div>
                    </div>

                    <!-- Card Motivazionale / Focus -->
                    <div class="bg-gradient-to-r from-cora-cream to-cora-lightpink p-5 rounded-3xl border border-cora-beige space-y-2 shadow-sm">
                        <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-cora-taupe">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                            <span>Focus del giorno</span>
                        </div>
                        <p class="font-serif text-lg text-cora-brown">"${state.userProfile.focusArea}"</p>
                        <p class="text-xs text-cora-taupe">Sveglia prevista alle ${state.userProfile.wakeTime} • Riposo alle ${state.userProfile.sleepTime}</p>
                    </div>

                    <!-- Sezione Routine Principali -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-serif text-lg text-cora-brown">Routine Mattutina</h3>
                            <button onclick="switchTab('routines')" class="text-xs text-cora-taupe hover:text-cora-brown font-medium">Gestisci</button>
                        </div>
                        <div class="space-y-2">
                            ${state.routines.morning.map(item => `
                                <div onclick="toggleRoutine('morning', ${item.id})" class="bg-white p-4 rounded-2xl border border-cora-beige flex items-center justify-between cursor-pointer hover:border-cora-taupe transition-all shadow-xs">
                                    <div class="flex items-center gap-3">
                                        <div class="w-6 h-6 rounded-full border-2 ${item.completed ? 'bg-cora-brown border-cora-brown flex items-center justify-center text-white' : 'border-cora-beige'}">
                                            ${item.completed ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                                        </div>
                                        <span class="text-sm font-medium ${item.completed ? 'line-through text-cora-taupe' : 'text-cora-brown'}">${item.title}</span>
                                    </div>
                                    <span class="text-xs text-cora-taupe bg-cora-bg px-2.5 py-1 rounded-full">${item.time}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Abitudini Rapide -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-serif text-lg text-cora-brown">Abitudini di Oggi</h3>
                            <button onclick="switchTab('habits')" class="text-xs text-cora-taupe hover:text-cora-brown font-medium">Tutte</button>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            ${state.habits.slice(0, 4).map(habit => `
                                <div onclick="toggleHabit(${habit.id})" class="bg-white p-3.5 rounded-2xl border border-cora-beige flex flex-col justify-between cursor-pointer hover:border-cora-taupe transition-all shadow-xs">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="text-xs font-medium text-cora-taupe">${habit.streak} giorni 🔥</span>
                                        <div class="w-5 h-5 rounded-full border ${habit.completedToday ? 'bg-cora-brown border-cora-brown flex items-center justify-center text-white' : 'border-cora-beige'}">
                                            ${habit.completedToday ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}
                                        </div>
                                    </div>
                                    <span class="text-xs font-semibold text-cora-brown">${habit.title}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Accesso Rapido alle Sezioni -->
                    <div class="space-y-3">
                        <h3 class="font-serif text-lg text-cora-brown">Esplora</h3>
                        <div class="grid grid-cols-3 gap-3">
                            <button onclick="switchTab('study')" class="bg-white p-4 rounded-2xl border border-cora-beige flex flex-col items-center text-center gap-2 hover:border-cora-taupe transition-all shadow-xs">
                                <i data-lucide="book-open" class="w-5 h-5 text-cora-brown"></i>
                                <span class="text-xs font-medium text-cora-brown">Studio</span>
                            </button>
                            <button onclick="switchTab('beauty')" class="bg-white p-4 rounded-2xl border border-cora-beige flex flex-col items-center text-center gap-2 hover:border-cora-taupe transition-all shadow-xs">
                                <i data-lucide="sparkles" class="w-5 h-5 text-cora-brown"></i>
                                <span class="text-xs font-medium text-cora-brown">Beauty</span>
                            </button>
                            <button onclick="switchTab('journal')" class="bg-white p-4 rounded-2xl border border-cora-beige flex flex-col items-center text-center gap-2 hover:border-cora-taupe transition-all shadow-xs">
                                <i data-lucide="book" class="w-5 h-5 text-cora-brown"></i>
                                <span class="text-xs font-medium text-cora-brown">Journal</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleRoutine(type, id) {
            const list = state.routines[type];
            const item = list.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                saveData();
                render();
            }
        }

        function toggleHabit(id) {
            const habit = state.habits.find(h => h.id === id);
            if (habit) {
                habit.completedToday = !habit.completedToday;
                if (habit.completedToday) habit.streak += 1;
                else habit.streak = Math.max(0, habit.streak - 1);
                saveData();
                render();
            }
        }

        // ==================== ROUTINE FLESSIBILI (SUGGEST) ====================
        function renderRoutines() {
            return `
                <div class="p-6 space-y-6 fade-in">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">Organizzazione</span>
                            <h1 class="text-2xl font-serif text-cora-brown mt-0.5">Le tue Routine</h1>
                        </div>
                        <button onclick="openSuggestModal()" class="bg-cora-cream text-cora-brown text-xs px-3.5 py-2 rounded-xl font-medium border border-cora-beige flex items-center gap-1.5 shadow-xs">
                            <i data-lucide="lightbulb" class="w-3.5 h-3.5"></i>
                            <span>Suggerimenti</span>
                        </button>
                    </div>

                    <!-- Routine Mattutina -->
                    <div class="bg-white p-5 rounded-3xl border border-cora-beige space-y-4 shadow-sm">
                        <div class="flex justify-between items-center border-b border-cora-cream pb-3">
                            <h3 class="font-serif text-lg text-cora-brown flex items-center gap-2">
                                <i data-lucide="sun" class="w-4 h-4 text-amber-600"></i> Routine Mattutina
                            </h3>
                            <button onclick="addRoutineItem('morning')" class="text-xs bg-cora-lightpink px-2.5 py-1 rounded-lg text-cora-brown font-medium">+ Aggiungi</button>
                        </div>
                        <div class="space-y-2">
                            ${state.routines.morning.map(item => `
                                <div class="flex items-center justify-between p-3 bg-cora-bg rounded-xl border border-cora-beige/60">
                                    <div class="flex items-center gap-3">
                                        <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleRoutine('morning', ${item.id})" class="accent-[#4A3E3D] w-4 h-4">
                                        <span class="text-sm ${item.completed ? 'line-through text-cora-taupe' : 'text-cora-brown'}">${item.title}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs text-cora-taupe">${item.time}</span>
                                        <button onclick="deleteRoutineItem('morning', ${item.id})" class="text-cora-taupe hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Routine Serale -->
                    <div class="bg-white p-5 rounded-3xl border border-cora-beige space-y-4 shadow-sm">
                        <div class="flex justify-between items-center border-b border-cora-cream pb-3">
                            <h3 class="font-serif text-lg text-cora-brown flex items-center gap-2">
                                <i data-lucide="moon" class="w-4 h-4 text-indigo-400"></i> Routine Serale
                            </h3>
                            <button onclick="addRoutineItem('evening')" class="text-xs bg-cora-lightpink px-2.5 py-1 rounded-lg text-cora-brown font-medium">+ Aggiungi</button>
                        </div>
                        <div class="space-y-2">
                            ${state.routines.evening.map(item => `
                                <div class="flex items-center justify-between p-3 bg-cora-bg rounded-xl border border-cora-beige/60">
                                    <div class="flex items-center gap-3">
                                        <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleRoutine('evening', ${item.id})" class="accent-[#4A3E3D] w-4 h-4">
                                        <span class="text-sm ${item.completed ? 'line-through text-cora-taupe' : 'text-cora-brown'}">${item.title}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs text-cora-taupe">${item.time}</span>
                                        <button onclick="deleteRoutineItem('evening', ${item.id})" class="text-cora-taupe hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function addRoutineItem(type) {
            const title = prompt("Nome dell'attività:");
            if (title) {
                const time = prompt("Durata stimata (es. 15 min):", "15 min");
                state.routines[type].push({
                    id: Date.now(),
                    title,
                    time: time || '15 min',
                    completed: false
                });
                saveData();
                render();
            }
        }

        function deleteRoutineItem(type, id) {
            state.routines[type] = state.routines[type].filter(i => i.id !== id);
            saveData();
            render();
        }

        function openSuggestModal() {
            alert("💡 Suggerimento intelligente (Modalità Suggest):\nVisto che oggi hai una giornata intensa, l'app suggerisce di accorciare la sessione di skincare serale a 10 minuti o posticipare le letture a domani. La scelta spetta sempre a te!");
        }

        // ==================== HABIT TRACKER ====================
        function renderHabits() {
            return `
                <div class="p-6 space-y-6 fade-in">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">Costanza</span>
                            <h1 class="text-2xl font-serif text-cora-brown mt-0.5">Habit Tracker</h1>
                        </div>
                        <button onclick="addHabit()" class="bg-cora-brown text-white text-xs px-3.5 py-2 rounded-xl font-medium shadow-sm">
                            + Nuova Abitudine
                        </button>
                    </div>

                    <div class="space-y-3">
                        ${state.habits.map(habit => `
                            <div class="bg-white p-4 rounded-2xl border border-cora-beige flex items-center justify-between shadow-xs">
                                <div class="flex items-center gap-3">
                                    <button onclick="toggleHabit(${habit.id})" class="w-7 h-7 rounded-full border-2 ${habit.completedToday ? 'bg-cora-brown border-cora-brown flex items-center justify-center text-white' : 'border-cora-beige'}">
                                        ${habit.completedToday ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                                    </button>
                                    <div>
                                        <h4 class="text-sm font-semibold text-cora-brown">${habit.title}</h4>
                                        <span class="text-xs text-cora-taupe">Serie consecutiva: ${habit.streak} giorni 🔥</span>
                                    </div>
                                </div>
                                <button onclick="deleteHabit(${habit.id})" class="text-cora-taupe hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function addHabit() {
            const title = prompt("Nome della nuova abitudine:");
            if (title) {
                state.habits.push({
                    id: Date.now(),
                    title,
                    streak: 0,
                    completedToday: false
                });
                saveData();
                render();
            }
        }

        function deleteHabit(id) {
            state.habits = state.habits.filter(h => h.id !== id);
            saveData();
            render();
        }

        // ==================== CALENDARIO ====================
        function renderCalendar() {
            const days = Array.from({length: 30}, (_, i) => i + 1);
            return `
                <div class="p-6 space-y-6 fade-in">
                    <div>
                        <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">Panoramica Mensile</span>
                        <h1 class="text-2xl font-serif text-cora-brown mt-0.5">Calendario & Attività</h1>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-cora-beige space-y-4 shadow-sm">
                        <div class="flex justify-between items-center font-serif text-lg text-cora-brown border-b border-cora-cream pb-3">
                            <span>Novembre 2026</span>
                            <span class="text-xs font-sans text-cora-taupx">Tutto sincronizzato</span>
                        </div>
                        <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-cora-taupe">
                            <span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span>
                        </div>
                        <div class="grid grid-cols-7 gap-2 text-center text-xs">
                            ${days.map(d => `
                                <div class="aspect-square flex items-center justify-center rounded-xl ${d === 18 ? 'bg-cora-brown text-white font-bold shadow-sm' : 'bg-cora-bg text-cora-brown border border-cora-beige/40'}">
                                    ${d}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-cora-beige space-y-3 shadow-sm">
                        <h3 class="font-serif text-md text-cora-brown">In programma oggi</h3>
                        <div class="space-y-2 text-xs text-cora-taupe">
                            <div class="p-3 bg-cora-bg rounded-xl border border-cora-beige/50 flex justify-between">
                                <span class="font-medium text-cora-brown">Verifica di Letteratura Italiana</span>
                                <span>Ore 09:00</span>
                            </div>
                            <div class="p-3 bg-cora-bg rounded-xl border border-cora-beige/50 flex justify-between">
                                <span class="font-medium text-cora-brown">Trattamento Skincare & Haircare</span>
                                <span>Ore 20:30</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== STUDIO & PRODUTTIVITÀ ====================
        function renderStudy() {
            return `
                <div class="p-6 space-y-6 fade-in">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">Accademico</span>
                            <h1 class="text-2xl font-serif text-cora-brown mt-0.5">Studio & Timer</h1>
                        </div>
                        <button onclick="addSubject()" class="bg-cora-brown text-white text-xs px-3 py-2 rounded-xl font-medium">+ Materia</button>
                    </div>

                    <!-- Pomodoro Timer Minimal -->
                    <div class="bg-white p-6 rounded-3xl border border-cora-beige text-center space-y-4 shadow-sm">
                        <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">Timer Concentrazione (Pomodoro)</span>
                        <div id="pomodoro-display" class="font-serif text-5xl text-cora-brown font-bold tracking-tight">25:00</div>
                        <div class="flex justify-center gap-3">
                            <button onclick="togglePomodoro()" id="pomodoro-btn" class="px-6 py-2.5 bg-cora-brown text-white text-xs font-medium rounded-xl shadow-sm">Avvia</button>
                            <button onclick="resetPomodoro()" class="px-4 py-2.5 bg-cora-bg text-cora-brown text-xs font-medium rounded-xl border border-cora-beige">Reset</button>
                        </div>
                    </div>

                    <!-- Materie -->
                    <div class="space-y-3">
                        <h3 class="font-serif text-lg text-cora-brown">Le tue Materie</h3>
                        ${state.studySubjects.map(sub => `
                            <div class="bg-white p-4 rounded-2xl border border-cora-beige space-y-2 shadow-xs">
                                <div class="flex justify-between items-center">
                                    <h4 class="text-sm font-semibold text-cora-brown">${sub.name}</h4>
                                    <span class="text-xs text-cora-taupe">${sub.progress}%</span>
                                </div>
                                <div class="w-full bg-cora-bg h-2 rounded-full overflow-hidden border border-cora-beige/40">
                                    <div class="bg-cora-brown h-full rounded-full" style="width: ${sub.progress}%"></div>
                                </div>
                                <p class="text-xs text-cora-taupe">Prossimo obiettivo: ${sub.nextTask}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        let pomodoroInterval = null;
        let timeLeft = 25 * 60;
        let isRunning = false;

        function togglePomodoro() {
            const btn = document.getElementById('pomodoro-btn');
            if (!isRunning) {
                isRunning = true;
                btn.innerText = 'Pausa';
                pomodoroInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updatePomodoroDisplay();
                    } else {
                        clearInterval(pomodoroInterval);
                        isRunning = false;
                        alert("Sessione Pomodoro completata! Ottimo lavoro ✨");
                        timeLeft = 25 * 60;
                        updatePomodoroDisplay();
                        btn.innerText = 'Avvia';
                    }
                }, 1000);
            } else {
                isRunning = false;
                clearInterval(pomodoroInterval);
                btn.innerText = 'Riprendi';
            }
        }

        function resetPomodoro() {
            clearInterval(pomodoroInterval);
            isRunning = false;
            timeLeft = 25 * 60;
            updatePomodoroDisplay();
            const btn = document.getElementById('pomodoro-btn');
            if (btn) btn.innerText = 'Avvia';
        }

        function updatePomodoroDisplay() {
            const el = document.getElementById('pomodoro-display');
            if (el) {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                el.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
        }

        function addSubject() {
            const name = prompt("Nome della materia:");
            if (name) {
                state.studySubjects.push({ id: Date.now(), name, progress: 0, nextTask: 'Prima sessione' });
                saveData();
                render();
            }
        }

        // ==================== BEAUTY & SELF-CARE ====================
        function renderBeauty() {
            return `
                <div class="p-6 space-y-6 fade-in">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">Self-Care</span>
                            <h1 class="text-2xl font-serif text-cora-brown mt-0.5">Beauty & Prodotti</h1>
                        </div>
                        <button onclick="addProduct()" class="bg-cora-brown text-white text-xs px-3 py-2 rounded-xl font-medium">+ Prodotto</button>
                    </div>

                    <div class="space-y-3">
                        <h3 class="font-serif text-lg text-cora-brown">Archivio Prodotti</h3>
                        ${state.beautyProducts.map(prod => `
                            <div class="bg-white p-4 rounded-2xl border border-cora-beige flex items-center justify-between shadow-xs">
                                <div>
                                    <span class="text-[10px] uppercase font-semibold text-cora-taupe">${prod.category} • ${prod.brand}</span>
                                    <h4 class="text-sm font-semibold text-cora-brown">${prod.name}</h4>
                                    <span class="text-xs text-cora-taupe">Stato: ${prod.status}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs bg-cora-lightpink px-2.5 py-1 rounded-full text-cora-brown">★ ${prod.rating}</span>
                                    <button onclick="deleteProduct(${prod.id})" class="text-cora-taupe hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function addProduct() {
            const name = prompt("Nome del prodotto:");
            if (name) {
                const brand = prompt("Marca:", "Brand");
                state.beautyProducts.push({ id: Date.now(), name, brand: brand || 'Brand', category: 'Skincare', status: 'In uso', rating: 5 });
                saveData();
                render();
            }
        }

        function deleteProduct(id) {
            state.beautyProducts = state.beautyProducts.filter(p => p.id !== id);
            saveData();
            render();
        }

        // ==================== JOURNAL & MOOD ====================
        function renderJournal() {
            return `
                <div class="p-6 space-y-6 fade-in">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">Riflessioni</span>
                            <h1 class="text-2xl font-serif text-cora-brown mt-0.5">Journal & Mood</h1>
                        </div>
                        <button onclick="addJournalEntry()" class="bg-cora-brown text-white text-xs px-3.5 py-2 rounded-xl font-medium">+ Nuova Nota</button>
                    </div>

                    <div class="space-y-3">
                        ${state.journalEntries.length === 0 ? `
                            <div class="bg-white p-6 rounded-2xl border border-cora-beige text-center text-cora-taupe text-xs">
                                Nessuna nota nel diario. Scrivi il tuo primo pensiero!
                            </div>
                        ` : state.journalEntries.map(entry => `
                            <div class="bg-white p-4 rounded-2xl border border-cora-beige space-y-1 shadow-xs">
                                <span class="text-[10px] text-cora-taupe">${entry.date}</span>
                                <p class="text-sm text-cora-brown">${entry.text}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function addJournalEntry() {
            const text = prompt("Come ti senti oggi? Annota i tuoi pensieri:");
            if (text) {
                const date = new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
                state.journalEntries.unshift({ id: Date.now(), text, date });
                saveData();
                render();
            }
        }

        // ==================== MENU & IMPOSTAZIONI ====================
        function renderMenu() {
            return `
                <div class="p-6 space-y-6 fade-in">
                    <div>
                        <span class="text-xs uppercase tracking-wider text-cora-taupe font-semibold">Menu</span>
                        <h1 class="text-2xl font-serif text-cora-brown mt-0.5">Altre Sezioni</h1>
                    </div>

                    <div class="space-y-2">
                        <button onclick="switchTab('study')" class="w-full bg-white p-4 rounded-2xl border border-cora-beige flex items-center justify-between text-cora-brown hover:bg-cora-lightpink transition-all shadow-xs">
                            <span class="text-sm font-medium flex items-center gap-3"><i data-lucide="book-open" class="w-4 h-4"></i> Studio & Produttività</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-cora-taupe"></i>
                        </button>
                        <button onclick="switchTab('beauty')" class="w-full bg-white p-4 rounded-2xl border border-cora-beige flex items-center justify-between text-cora-brown hover:bg-cora-lightpink transition-all shadow-xs">
                            <span class="text-sm font-medium flex items-center gap-3"><i data-lucide="sparkles" class="w-4 h-4"></i> Beauty Planner & Prodotti</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-cora-taupe"></i>
                        </button>
                        <button onclick="switchTab('journal')" class="w-full bg-white p-4 rounded-2xl border border-cora-beige flex items-center justify-between text-cora-brown hover:bg-cora-lightpink transition-all shadow-xs">
                            <span class="text-sm font-medium flex items-center gap-3"><i data-lucide="book" class="w-4 h-4"></i> Journal & Mood</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-cora-taupe"></i>
                        </button>
                        <button onclick="resetApp()" class="w-full bg-red-50 p-4 rounded-2xl border border-red-200 flex items-center justify-between text-red-600 hover:bg-red-100 transition-all shadow-xs mt-6">
                            <span class="text-sm font-medium flex items-center gap-3"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Ricomincia Onboarding</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-red-400"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function resetApp() {
            if (confirm("Vuoi davvero azzerare i dati e ripetere l'onboarding?")) {
                localStorage.removeItem('become_her_state');
                state.onboardingCompleted = false;
                render();
            }
        }
    </script>
</body>
</html>
